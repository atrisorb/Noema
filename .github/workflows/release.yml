name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: crates/app/ui/package-lock.json

      - name: Generate platform icons
        run: node tools/design/build-icons.mjs

      - name: Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Rust tests
        run: cargo test --workspace

      - name: Windows packaging tools
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libfuse2t64 || sudo apt-get install -y rpm libfuse2 || true
          curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build.ps1

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash packaging/build.sh

      - name: Tauri CLI
        run: cargo install tauri-cli --version 2.12.5 --locked

      - name: macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Desktop bundles (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/tauri.ps1 -SkipBuild

      - name: Desktop bundles (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash packaging/tauri.sh

      - uses: actions/upload-artifact@v7
        with:
          name: noema-${{ matrix.os }}
          path: dist/**
          if-no-files-found: error

      - name: Publish to GitHub Release (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --generate-notes
          }
          Get-ChildItem dist -File | ForEach-Object { gh release upload ${{ github.ref_name }} $_.FullName --clobber }
          if (Test-Path dist/tauri) {
            Get-ChildItem dist/tauri -File | ForEach-Object { gh release upload ${{ github.ref_name }} $_.FullName --clobber }
          }

      - name: Publish to GitHub Release (macOS / Linux)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} >/dev/null 2>&1 || gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --generate-notes || true
          for f in dist/*.* dist/tauri/*.*; do
            [ -f "$f" ] && gh release upload ${{ github.ref_name }} "$f" --clobber
          done
